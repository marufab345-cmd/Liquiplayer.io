name: Build AMOLED Liquid Music Player

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap missing platform runners cleanly
        run: |
          flutter create . --project-name amoled_liquid_player --org com.liquid.player
          flutter pub get

      - name: Patch Android configurations & old plugin namespaces
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_AUDIO" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <application/' "$MANIFEST"
          fi
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle* || true
          
          # Auto-patch old plugins missing namespace for AGP 8+
          PLUGIN_GRADLE="$HOME/.pub-cache/hosted/pub.dev/on_audio_query_android-1.1.0/android/build.gradle"
          if [ -f "$PLUGIN_GRADLE" ]; then
            if ! grep -q "namespace" "$PLUGIN_GRADLE"; then
              sed -i 's/android {/android {\n    namespace "com.lucasjosino.flutter_to_audio"\n/g' "$PLUGIN_GRADLE"
            fi
          fi

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --no-pub

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amoled-liquid-player-release
          path: build/app/outputs/flutter-apk/app-release.apk
